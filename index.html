<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Local-first Mermaid diagram editor with live preview, templates, exports and share links." />
    <meta name="color-scheme" content="dark light" />
    <title>Mermaid Diagram Editor</title>
    <script>
      // Apply the saved UI theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('mde:preferences') || '{}');
          var mode = prefs.uiTheme || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This application requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
